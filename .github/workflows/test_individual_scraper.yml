name: Test Individual Scraper
on:
  workflow_dispatch:
    inputs:
      scraper_name:
        description: 'Name of the scraper script to run (without .py extension)'
        required: true
        type: string

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: IPv4 / IPv6 connectivity test (reality-brno.net)
        run: |
          echo "=== DNS ==="
          dig +short A www.reality-brno.net || true
          dig +short AAAA www.reality-brno.net || true
          echo -e "\n=== cURL ==="
          time curl -4 -I --connect-timeout 15 https://www.reality-brno.net || true
          time curl -6 -I --connect-timeout 15 https://www.reality-brno.net || true

      - name: Run scraper
        run: python scrapers/${{ github.event.inputs.scraper_name }}.py 