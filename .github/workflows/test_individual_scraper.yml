name: Test Individual Scraper
on:
  workflow_dispatch:
    inputs:
      scraper_name:
        description: 'Name of the scraper script to run (without .py extension)'
        required: true
        type: string

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Proxy auth smoke-test
        env:
          PROXY: "http://${{ secrets.PROXY_USERNAME }}:${{ secrets.PROXY_PASSWORD }}@${{ secrets.PROXY_HOST }}:${{ secrets.PROXY_PORT }}"
        run: |
          echo "Testing proxy authentication…"
          curl -x "$PROXY" -I https://www.google.com --connect-timeout 10 || exit 1

      # 1️⃣ Direct attempt with up to 2 tries (initial + 1 retry)
      - name: Run scraper (direct)
        id: run_plain
        run: |
          python scrapers/${{ github.event.inputs.scraper_name }}.py
          # Fail if output JSON absent or empty (0 bytes)
          if [ ! -s "${{ github.event.inputs.scraper_name }}.json" ]; then
            echo "JSON output missing or empty – failing step" >&2
            exit 1
          fi
        retry:
          max-attempts: 2   # 1 original + 1 retry
          delay-seconds: 20
        continue-on-error: true

      # 2️⃣ Proxy fallback, up to 2 tries, only if direct run failed
      - name: Run scraper via proxy
        if: steps.run_plain.outcome == 'failure'
        env:
          HTTPS_PROXY: "http://${{ secrets.PROXY_USERNAME }}:${{ secrets.PROXY_PASSWORD }}@${{ secrets.PROXY_HOST }}:${{ secrets.PROXY_PORT }}"
          HTTP_PROXY: "http://${{ secrets.PROXY_USERNAME }}:${{ secrets.PROXY_PASSWORD }}@${{ secrets.PROXY_HOST }}:${{ secrets.PROXY_PORT }}"
        run: |
          echo "Retrying through proxy…"
          python scrapers/${{ github.event.inputs.scraper_name }}.py
          if [ ! -s "${{ github.event.inputs.scraper_name }}.json" ]; then
            echo "JSON output missing or empty after proxy attempt" >&2
            exit 1
          fi
        retry:
          max-attempts: 2
          delay-seconds: 20