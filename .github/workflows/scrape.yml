name: Full scraper pipeline
on:
  schedule:
    - cron: '0 13 * * *'  # Run daily at 1 PM UTC = 3 PM CEST
  workflow_dispatch:     # Keep manual trigger for testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full pipeline with retry logic
        run: |
          python pipeline.py
          if [ $? -ne 0 ]; then
            echo "Pipeline failed, trying with proxy..."
            python pipeline.py --proxy
            if [ $? -ne 0 ]; then
              echo "Pipeline failed again, exiting..."
              exit 1
            fi
          fi
        env:
          ULOV_DOMOV_EMAIL: ${{ secrets.ULOV_DOMOV_EMAIL }}
          ULOV_DOMOV_PASSWORD: ${{ secrets.ULOV_DOMOV_PASSWORD }}
      - name: Commit and push merged file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add MERGED_LISTINGS.json
          git commit -m "Update MERGED_LISTINGS.json from GitHub Actions" || exit 0
          git push
