name: Full scraper pipeline
on:
  schedule:
    - cron: '0 13 * * *'  # Run daily at 1 PM UTC = 3 PM CEST
  workflow_dispatch:     # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      ULOV_DOMOV_EMAIL: ${{ secrets.ULOV_DOMOV_EMAIL }}
      ULOV_DOMOV_PASSWORD: ${{ secrets.ULOV_DOMOV_PASSWORD }}
      PROXY_HOST: ${{ secrets.PROXY_HOST }}
      PROXY_PORT: ${{ secrets.PROXY_PORT }}
      PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
      PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run full pipeline
        id: run_pipeline
        run: python pipeline.py

      - name: Commit and push merged file
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add MERGED_LISTINGS.json
          git commit -m "Update MERGED_LISTINGS.json from GitHub Actions" || exit 0
          git push

